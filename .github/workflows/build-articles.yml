name: Build Articles

on:
  push:
    branches: [main]
    paths: ['artigos/*.md', 'links.json']
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'  # a cada 10min, para o agendador de produtos com horario

concurrency:
  group: build-articles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Pull latest antes de buildar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main

      - run: node scripts/expire-links.js

      - name: Build products
        id: build_products
        run: node scripts/build-products.js

      - run: node scripts/build-articles.js

      - name: Commit e push
        run: |
          git add -A
          git diff --staged --quiet || git commit -m "build: gera artigos e sitemap [skip ci]"
          git pull --rebase origin main
          git push

      - name: Notifica produtos agendados publicados
        if: steps.build_products.outputs.promoted == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          CLEAN_URL=$(echo "$WEBHOOK_URL" | tr -d '[:space:]')
          curl -s -f -X POST "$CLEAN_URL" \
            -H "Content-Type: application/json" \
            -d '{"event":"links_updated","author":"github-actions[bot]","commit":"${{ github.sha }}","raw_url":"https://raw.githubusercontent.com/${{ github.repository }}/main/links.json"}'
